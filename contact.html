<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact</title>
  </head>
  <body>
          <header>
        <h1>Ralph Gereg - Portfolio Site</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Me</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact Me</a>
      </nav>
    </header>
    <main>
      <h2>Contact Me</h2>

      <p>Have a question, project idea, or opportunity you would like to discuss? I would love to hear from you, so feel free to get in touch!</p>

          <form action="#">

      <label for="name">Name</label>
      <input type="text" id="name" name="name" required minlength="2"> <br>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required> <br>

      <label for="topic">topic</label>
      <select id="topic" name="topic" required>
        <option value="">Choose a topic</option>
        <option value="compliment">Compliment</option>
        <option value="complaint">Complaint</option>
        <option value="other">Something else</option>
      </select> <br>

      <label for="message">Message</label>
      <textarea id="message" name="message" required rows="6" cols="40" minlength="10"></textarea> <br>

      <input type="checkbox" id="newsletter" name="newsletter" value="yes">
      <label for="newsletter">Newsletter opt-in</label> <br>

      <fieldset>
        <legend>How should we contact you?</legend>

        <input type="radio"  id="contact-email" name="contact" value="email">
        <label for="contact-email">Email</label> <br>

        <input type="radio" id="contact-text" name="contact" value="text">
        <label for="contact-text">Text Message</label> <br>
      </fieldset>

      <button type="submit">Send message</button>
    </form>
    </main>
  </body>
</html>
